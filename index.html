<!doctype html>
<html lang="en" data-theme="calm" data-size="m" data-font="hyperlegible" data-spacing="relaxed">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body>

          <rect x="2" y="2" width="116" height="116" rx="30" fill="#ffffff" stroke="#121417" stroke-width="5"/>

          <path d="M60 34 C60 24 52 18 42 19 C42 29 50 35 60 34 Z" fill="#5ce1e6" stroke="#121417" stroke-width="2.5" stroke-linejoin="round"/>

          <span class="brand-name"><span class="brand-thrive">Thrive</span><span class="brand-together">Together</span></span>
          <span class="brand-tagline">Nobody should build alone</span>
        </span>
      </a>
      <nav aria-label="Account">
        <ul class="header-links">
          <li><a href="#/profile" data-route="profile">My profile</a></li>
          <li><a href="#/settings" data-route="settings">Settings</a></li>

      </nav>
      </div>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="#/today" data-route="today">Today</a></li>
          <li><a href="#/plan" data-route="plan">Planner</a></li>

          <li><a href="#/cowork" data-route="cowork">Co-work</a></li>
        </ul>
      </nav>

  </main>

  <div id="toast-region" class="toast-region"></div>
  <div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

</html>
